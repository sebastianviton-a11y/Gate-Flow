<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">Gate Flow isotipo</title>
  <desc id="desc">Paquete isométrico con las iniciales G y F integradas.</desc>
  <defs>
    <linearGradient id="gfGradient" x1="20" y1="20" x2="200" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.55" stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  
  <g transform="translate(10,10)">
    
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Tapa del paquete con apertura frontal sutil -->
    <path d="M30 70 L110 22 L190 70 L132 105"/>
    <path d="M103 121 L30 78"/>
    <!-- Aristas exteriores del paquete -->
    <path d="M30 70 V150 L110 198 V112"/>
    <path d="M190 70 V150 L110 198"/>
    <!-- G integrada en la cara izquierda -->
    <path d="M86 111 L49 133 V153 L85 175 V146 L67 135"/>
    <!-- F integrada en la cara derecha -->
    <path d="M134 111 L172 133"/>
    <path d="M134 143 L164 160"/>
  </g>
  </g>
</svg>