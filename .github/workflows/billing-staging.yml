# Batería billing contra STAGING — solo manual, separada del CI de PR.
# Escribe filas sintéticas ZZ_AUTOTEST_ en la base de staging DENTRO de una
# transacción y las revierte (tests/billing/staging/run-staging.sh); antes y
# después compara un hash de 11 tablas. Nunca producción.
#
# Requisitos (los configura una persona con permisos en el repo):
#   - environment "billing-staging" con revisores obligatorios y, de
#     preferencia, limitado a las ramas permitidas
#   - secreto de ese environment: GF_STAGING_DB_URL (cadena de conexión de la
#     base de STAGING; debe contener el ref de staging)
name: billing · staging (manual)

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe "staging": escribe filas sintéticas en staging dentro de una transacción y las revierte'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: billing-staging
  cancel-in-progress: false

jobs:
  staging:
    if: inputs.confirmacion == 'staging'
    name: escenarios 1–20 en staging (revertidos) + HTTP
    runs-on: ubuntu-24.04
    environment: billing-staging
    timeout-minutes: 15
    env:
      GF_BILLING_E2E_STAGING: "1"
      GF_BILLING_CONFIRMACION: ${{ inputs.confirmacion }}
      GF_STAGING_DB_URL: ${{ secrets.GF_STAGING_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cliente de PostgreSQL
        run: |
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq postgresql-client; }
          psql --version
      - name: Staging (sin dependencias de pnpm)
        run: node tests/billing/run.mjs --staging
